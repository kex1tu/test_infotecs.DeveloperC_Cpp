name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  main-ci:
    name: Build, Lint & Valgrind
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kex1tu/cpp-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check code formatting (clang-format)
        run: |
          find console_app logger tests \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) | xargs clang-format --dry-run --Werror

      - name: Build project (Make)
        run: |
          make clean
          make -j$(nproc)

      - name: Run Clang-Tidy Linter
        run: |
          clang-tidy console_app/src/main.cpp console_app/src/utilities.cpp -- -std=c++17 -Iconsole_app/src -Ilogger/include
          clang-tidy logger/src/file_sink.cpp logger/src/logger.cpp -- -std=c++17 -Ilogger/include

      - name: Run Unit Tests
        run: |
          make test

      - name: Run Valgrind Memory Checks
        run: |
          for test_bin in tests/test_*; do
            if [ -x "$test_bin" ] && [ ! -d "$test_bin" ]; then
              echo "==> Running Valgrind on $test_bin..."
              valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=all "$test_bin"
            fi
          done

  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kex1tu/cpp-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan & UBSan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
            env_vars: "ASAN_OPTIONS=check_initialization_order=1:strict_init_order=1:detect_stack_use_after_return=1"
          - name: TSan
            flags: "-fsanitize=thread"
            env_vars: "TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Sanitizer
        run: |
          make clean
          make EXTRA_CXXFLAGS="${{ matrix.flags }}" -j$(nproc)

      - name: Run Tests with Sanitizer
        run: |
          export ${{ matrix.env_vars }}
          if command -v setarch >/dev/null 2>&1 && setarch $(uname -m) -R true 2>/dev/null; then
            setarch $(uname -m) -R make -C tests test
          else
            make -C tests test
          fi
